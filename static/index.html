<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cortex</title>
  <link rel="icon" id="dynamic-favicon" href="/favicon.ico" />
  <script src="https://unpkg.com/cytoscape@3.29.2/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/cytoscape-cose-bilkent@4.1.0/cytoscape-cose-bilkent.js"></script>
  <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Light-mode surface palette */
      --bg:           #f4f4f8;
      --surface:      #ffffff;
      --surface-2:    #f9f9fc;
      --surface-3:    #f0f0f5;
      --border:       #e4e4ec;
      --border-sub:   #ededf3;

      /* Text */
      --text:         #111118;
      --text-muted:   #6b7280;
      --text-dim:     #a1a1aa;

      /* Accent */
      --accent:       #6366f1;
      --accent-h:     #4f46e5;
      --accent-dim:   rgba(99,102,241,0.10);

      /* Node type colors (for inspector badges etc.) */
      --c-svc:        #4338ca;
      --c-db:         #065f46;
      --c-infra:      #92400e;
      --c-file:       #0c4a6e;
      --c-sys:        #6b21a8;

      /* Diff */
      --diff-add:     #16a34a;
      --diff-del:     #dc2626;
      --diff-mod:     #d97706;

      /* Layout */
      --sidebar-w:    256px;
      --header-h:     44px;
      --statusbar-h:  24px;
      --radius-card:  14px;
      --radius-btn:   99px;
      --radius-input: 10px;
      --mono: Consolas, 'JetBrains Mono', monospace;
    }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    #header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
      padding: 0 16px; z-index: 100; user-select: none;
    }
    #header-logo { width: 26px; height: 26px; flex-shrink: 0; }
    #header-logo img { width: 26px; height: 26px; object-fit: contain; border-radius: 7px; }
    .logo-fallback {
      width: 26px; height: 26px; border-radius: 8px;
      background: var(--accent); color: #fff;
      font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    #header-title   { font-size: 14px; font-weight: 700; color: var(--text); }
    #header-sep     { color: var(--text-dim); font-size: 16px; margin: 0 2px; }
    #header-project { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    #header-spacer  { flex: 1; }

    .header-btn {
      height: 30px; padding: 0 14px;
      background: var(--surface-3); color: var(--text-muted);
      border: 1px solid var(--border); border-radius: var(--radius-btn);
      font-size: 12.5px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: color .12s, border-color .12s, background .12s;
    }
    .header-btn:hover { color: var(--text); border-color: #c4c4d0; background: var(--surface); }
    .header-btn svg { width: 13px; height: 13px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    #header-commit-btn {
      height: 30px; padding: 0 16px;
      background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius-btn);
      font-size: 12.5px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: background .12s;
    }
    #header-commit-btn:hover { background: var(--accent-h); }
    #header-commit-btn svg { width: 13px; height: 13px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ── Shell ──────────────────────────────────────────────────────── */
    #shell {
      position: fixed;
      top: var(--header-h); bottom: var(--statusbar-h);
      left: 0; right: 0;
      display: flex;
    }

    /* ── Sidebar ────────────────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* Search row */
    #search-row {
      padding: 12px 12px 8px;
      flex-shrink: 0; border-bottom: 1px solid var(--border-sub);
    }
    #search-input {
      width: 100%; padding: 7px 11px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-input); color: var(--text);
      font-size: 12.5px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    #search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    #search-input::placeholder { color: var(--text-dim); }
    #search-results { list-style: none; padding: 4px 0 0; }
    #search-results li {
      padding: 5px 4px; border-radius: 8px; cursor: pointer;
      font-size: 11.5px; font-family: var(--mono); color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: background .1s, color .1s;
    }
    #search-results li:hover { background: var(--surface-3); color: var(--text); }

    /* Section header */
    .section-head {
      padding: 10px 14px 5px;
      font-size: 9.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .12em;
      color: var(--text-dim); flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
    }

    /* Timeline */
    #timeline-section { flex-shrink: 0; border-bottom: 1px solid var(--border-sub); }
    #timeline-list  { list-style: none; padding: 0 8px 6px; }
    #timeline-list li {
      display: flex; align-items: flex-start; gap: 9px;
      padding: 6px 8px; border-radius: 10px; cursor: pointer;
      transition: background .1s; border-left: none;
    }
    #timeline-list li:hover    { background: var(--surface-3); }
    #timeline-list li.selected { background: var(--accent-dim); }
    .tl-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      border: 1.5px solid var(--text-dim); margin-top: 4px;
    }
    li.selected .tl-dot { border-color: var(--accent); background: var(--accent); }
    li:first-child .tl-dot { border-color: var(--diff-add); background: var(--diff-add); }
    .tl-label { font-size: 12px; color: var(--text); line-height: 1.3; font-weight: 500; }
    .tl-ts    { font-size: 10px; color: var(--text-dim); font-family: var(--mono); margin-top: 1px; }
    li.selected .tl-label { color: var(--accent-h); font-weight: 600; }
    #diff-banner {
      display: none; margin: 2px 12px 8px; padding: 5px 10px; border-radius: 10px;
      background: rgba(217,119,6,0.07); border: 1px solid rgba(217,119,6,0.2);
      font-size: 10.5px; color: var(--diff-mod); font-family: var(--mono);
    }
    #diff-banner.visible { display: block; }

    /* Inspector */
    #inspector-section { flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-height: 0; }
    #inspector-content { padding: 6px 14px 18px; flex: 1; }
    .empty-msg  { color: var(--text-dim); font-size: 11.5px; margin-top: 4px; }
    .insp-field { margin-bottom: 10px; }
    .insp-lbl   { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); margin-bottom: 3px; }
    .insp-val   { font-size: 12px; color: var(--text); word-break: break-word; line-height: 1.5; }
    .insp-badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 99px; font-size: 11px; font-weight: 600; }
    .insp-conns { list-style: none; }
    .insp-conns li { font-size: 11px; color: var(--text-muted); padding: 4px 0; border-bottom: 1px solid var(--border-sub); font-family: var(--mono); line-height: 1.4; }
    .insp-conns li:last-child { border-bottom: none; }

    /* ── Canvas area ────────────────────────────────────────────────── */
    #main          { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #canvas-wrapper {
      flex: 1; position: relative; overflow: hidden;
      /* Dotted grid background */
      background-color: #f4f4f8;
      background-image: radial-gradient(circle, #c4c4d4 1.5px, transparent 1.5px);
      background-size: 22px 22px;
    }
    #graph-canvas { width: 100%; height: 100%; background: transparent; }

    /* ── Status bar ─────────────────────────────────────────────────── */
    #status-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--statusbar-h);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 16px; gap: 12px;
      font-size: 11px; color: var(--text-dim);
      font-family: var(--mono); z-index: 50;
    }
    #status-ws  { display: flex; align-items: center; gap: 5px; }
    #ws-dot     { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); }
    #ws-dot.connected { background: var(--diff-add); }
    #ws-dot.error     { background: var(--diff-del); }
    #ws-label   { color: var(--text-muted); }
    .status-sep { color: var(--border); }
    #status-slot { color: var(--accent); }

    /* ── Export dropdown ────────────────────────────────────────────── */
    #export-menu {
      display: none; position: absolute; right: 0; top: 38px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-card); min-width: 168px;
      z-index: 200; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);
    }
    .export-item {
      padding: 9px 14px; font-size: 12.5px; cursor: pointer;
      color: var(--text-muted); display: flex; align-items: center; gap: 8px;
      transition: background .1s, color .1s;
    }
    .export-item:hover { background: var(--surface-3); color: var(--text); }
    .export-item svg { width: 13px; height: 13px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .export-item:first-child { border-radius: var(--radius-card) var(--radius-card) 0 0; }
    .export-item:last-child  { border-radius: 0 0 var(--radius-card) var(--radius-card); }

    /* ── Commit modal ───────────────────────────────────────────────── */
    #commit-modal-bg {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.28); backdrop-filter: blur(6px);
      z-index: 200; align-items: center; justify-content: center;
    }
    #commit-modal-bg.visible { display: flex; }
    #commit-modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 28px 24px 22px; width: 380px;
      box-shadow: 0 24px 64px rgba(0,0,0,.14), 0 4px 16px rgba(0,0,0,.08);
    }
    #commit-modal h3 { font-size: 15px; color: var(--text); margin-bottom: 14px; font-weight: 700; }
    #commit-msg-input {
      width: 100%; padding: 9px 12px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); font-size: 13px;
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    #commit-msg-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    #commit-msg-input::placeholder { color: var(--text-dim); }
    .modal-actions { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
    .btn-primary  { background: var(--accent); color: #fff; border: none; border-radius: var(--radius-btn); padding: 7px 20px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .12s; }
    .btn-primary:hover  { background: var(--accent-h); }
    .btn-secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--border); border-radius: var(--radius-btn); padding: 7px 16px; font-size: 13px; cursor: pointer; transition: background .12s, color .12s; }
    .btn-secondary:hover { background: var(--surface-3); color: var(--text); }

    /* ── Scrollbars ─────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #c4c4d0; }
  </style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div id="header-logo">
    <div class="logo-fallback" id="logo-fallback">C</div>
    <img id="logo-img" src="" alt="logo" style="display:none" />
  </div>
  <span id="header-title">Cortex</span>
  <span id="header-sep">/</span>
  <span id="header-project"></span>
  <div id="header-spacer"></div>

  <div style="position:relative">
    <button class="header-btn" id="export-btn" onclick="toggleExportMenu()">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export
    </button>
    <div id="export-menu">
      <div class="export-item" onclick="exportGraph('png')">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        PNG Screenshot
      </div>
      <div class="export-item" onclick="exportGraph('json')">
        <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        JSON Graph
      </div>
      <div class="export-item" onclick="exportGraph('triples')">
        <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/></svg>
        Semantic Triples
      </div>
    </div>
  </div>

  <button id="header-commit-btn" onclick="openCommitModal()">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><line x1="1.05" y1="12" x2="7" y2="12"/><line x1="17.01" y1="12" x2="22.96" y2="12"/></svg>
    Commit
  </button>
</div>

<!-- SHELL -->
<div id="shell">

  <!-- SIDEBAR: search + timeline + inspector — always visible, no tabs -->
  <div id="sidebar">

    <!-- Search -->
    <div id="search-row">
      <input id="search-input" type="text" placeholder="Search nodes…" oninput="onSearchInput(this.value)" />
      <ul id="search-results"></ul>
    </div>

    <!-- Timeline -->
    <div id="timeline-section">
      <div class="section-head">Timeline</div>
      <ul id="timeline-list"></ul>
      <div id="diff-banner"></div>
    </div>

    <!-- Inspector -->
    <div id="inspector-section">
      <div class="section-head">Inspector</div>
      <div id="inspector-content">
        <p class="empty-msg">Click a node to inspect it.</p>
      </div>
    </div>

  </div>

  <!-- CANVAS -->
  <div id="main">
    <div id="canvas-wrapper">
      <div id="graph-canvas"></div>
    </div>
  </div>

</div>

<!-- STATUS BAR -->
<div id="status-bar">
  <div id="status-ws">
    <div id="ws-dot"></div>
    <span id="ws-label">Connecting…</span>
  </div>
  <span class="status-sep">·</span>
  <span id="status-node-count">0 nodes</span>
  <span class="status-sep">·</span>
  <span id="status-edge-count">0 edges</span>
  <span class="status-sep">·</span>
  <span id="status-slot">live</span>
</div>

<!-- COMMIT MODAL -->
<div id="commit-modal-bg" onclick="closeCommitModal(event)">
  <div id="commit-modal">
    <h3>Commit Graph Snapshot</h3>
    <input id="commit-msg-input" type="text" placeholder="Describe this snapshot…" maxlength="200" />
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeCommitModal()">Cancel</button>
      <button class="btn-primary"   onclick="doCommit()">Save Snapshot</button>
    </div>
  </div>
</div>

<script>
let _ws = null, _nodes = [], _edges = [], _timeline = [];
let _selectedSlot = 0, _selectedNodeId = null, _diffData = null;

window.CortexUI = { onNodeClick, setDiff, setGraph, clearSearch };

(async function init() {
  await loadMeta();
  await loadTimeline();
  connectWS();
})();

async function loadMeta() {
  try {
    const r = await fetch('/api/meta');
    const meta = await r.json();
    document.title = 'Cortex — ' + meta.project_name;
    document.getElementById('header-project').textContent = meta.project_name;
    if (meta.favicon_b64) {
      const dataUrl = `data:${meta.favicon_mime};base64,${meta.favicon_b64}`;
      document.getElementById('dynamic-favicon').href = dataUrl;
      const li = document.getElementById('logo-img'), lf = document.getElementById('logo-fallback');
      li.src = dataUrl; li.style.display = 'block'; lf.style.display = 'none';
    } else {
      document.getElementById('logo-fallback').textContent = (meta.project_name || 'C')[0].toUpperCase();
    }
  } catch(e) { console.warn('Meta load failed:', e); }
}

async function loadTimeline() {
  try {
    const r = await fetch('/api/timeline');
    _timeline = await r.json();
    renderTimeline();
  } catch(e) { console.warn('Timeline load failed:', e); }
}

function renderTimeline() {
  const ul = document.getElementById('timeline-list');
  ul.innerHTML = '';
  const all = [{ slot: 0, label: 'Live', timestamp: '', message: '' }, ..._timeline];
  all.forEach((v, i) => {
    const li = document.createElement('li');
    if (v.slot === _selectedSlot) li.classList.add('selected');
    const dot = document.createElement('div'); dot.className = 'tl-dot';
    const info = document.createElement('div'); info.style.minWidth = '0';
    const label = document.createElement('div'); label.className = 'tl-label';
    label.textContent = v.label || (i === 0 ? 'Live' : `Commit #${_timeline.length - i + 1}`);
    info.appendChild(label);
    if (v.message) { const m = document.createElement('div'); m.className = 'tl-ts'; m.textContent = v.message; info.appendChild(m); }
    if (v.timestamp) { const t = document.createElement('div'); t.className = 'tl-ts'; t.textContent = v.timestamp.replace('T',' ').slice(0,16); info.appendChild(t); }
    li.appendChild(dot); li.appendChild(info);
    li.addEventListener('click', () => selectSlot(v.slot));
    ul.appendChild(li);
  });
}

async function selectSlot(slot) {
  _selectedSlot = slot; _diffData = null;
  document.querySelectorAll('#timeline-list li').forEach((li, i) => {
    const allSlots = [0, ..._timeline.map(v => v.slot)];
    li.classList.toggle('selected', allSlots[i] === slot);
  });
  const banner = document.getElementById('diff-banner');
  if (slot === 0) {
    banner.classList.remove('visible');
    await loadGraph(0);
  } else {
    await loadGraph(0);
    const currentSlot = _timeline.length > 0 ? _timeline[0].slot : null;
    if (currentSlot && currentSlot !== slot) {
      const diffR = await fetch(`/api/diff?from_slot=${slot}&to_slot=${currentSlot}`);
      _diffData = await diffR.json();
      const oldR = await fetch(`/api/graph?slot=${slot}`);
      const oldData = await oldR.json();
      const liveIds = new Set(_nodes.map(n => n.id));
      for (const on of (oldData.nodes || [])) { if (!liveIds.has(on.id)) _nodes.push(on); }
      for (const oe of (oldData.edges || [])) {
        const key = e => e.src+'|'+e.rel+'|'+e.dst;
        const liveKeys = new Set(_edges.map(key));
        if (!liveKeys.has(key(oe))) _edges.push(oe);
      }
      banner.textContent = `Diff ${slot} → current  ·  +${_diffData.added_nodes.length}  -${_diffData.deleted_nodes.length}  ~${_diffData.modified_nodes.length}`;
      banner.classList.add('visible');
    }
  }
  updateStatusCounts();
  if (window.CortexGraph) window.CortexGraph.render(_nodes, _edges, _diffData);
  else window._pendingGraph = { nodes: _nodes, edges: _edges, diffData: _diffData };
  document.getElementById('status-slot').textContent = slot === 0 ? 'live' : `slot ${slot}`;
}

async function loadGraph(slot) {
  const url = slot === 0 ? '/api/graph' : `/api/graph?slot=${slot}`;
  try {
    const r = await fetch(url); const data = await r.json();
    _nodes = data.nodes || []; window._nodes = _nodes;
    _edges = data.edges || []; window._edges = _edges;
    updateStatusCounts();
  } catch(e) { console.warn('Graph load failed:', e); }
}

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  _ws = new WebSocket(`${proto}://${location.host}/ws`);
  const dot = document.getElementById('ws-dot'), label = document.getElementById('ws-label');
  _ws.onopen  = () => { dot.className = 'connected'; label.textContent = 'Connected'; };
  _ws.onclose = () => { dot.className = 'error'; label.textContent = 'Disconnected'; setTimeout(connectWS, 3000); };
  _ws.onerror = () => { dot.className = 'error'; };
  _ws.onmessage = evt => handleWSMessage(JSON.parse(evt.data));
}

function handleWSMessage(msg) {
  if (msg.event === 'init') {
    _nodes = msg.nodes || []; window._nodes = _nodes;
    _edges = msg.edges || []; _timeline = msg.timeline || [];
    renderTimeline(); updateStatusCounts();
    if (window.CortexGraph) window.CortexGraph.render(_nodes, _edges, null);
    else window._pendingGraph = { nodes: _nodes, edges: _edges, diffData: null };
  } else if (msg.event === 'node_added') {
    _nodes.push(msg.node); (msg.edges||[]).forEach(e => _edges.push(e)); updateStatusCounts();
    if (window.CortexGraph && _selectedSlot === 0) window.CortexGraph.addNode(msg.node, msg.edges||[]);
  } else if (msg.event === 'snapshot') {
    _timeline.unshift(msg.entry); renderTimeline();
  }
}

function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function onNodeClick(nodeId) {
  _selectedNodeId = nodeId;
  const node = _nodes.find(n => n.id === nodeId);
  if (!node) return;
  const connectedEdges = _edges.filter(e => e.src === nodeId || e.dst === nodeId);
  const isDesign = node.label === 'SystemDesign';

  const typePal = {
    Service:        { bg: '#eef2ff', txt: '#4338ca', bdr: '#a5b4fc' },
    Database:       { bg: '#ecfdf5', txt: '#065f46', bdr: '#6ee7b7' },
    Infrastructure: { bg: '#fffbeb', txt: '#92400e', bdr: '#fcd34d' },
    File:           { bg: '#e0f2fe', txt: '#0c4a6e', bdr: '#7dd3fc' },
    SystemDesign:   { bg: '#faf5ff', txt: '#6b21a8', bdr: '#d8b4fe' },
  };
  const tp = typePal[node.label] || { bg: '#f3f4f6', txt: '#374151', bdr: '#d1d5db' };

  const statusPal = { shipped: { bg: '#dcfce7', txt: '#15803d', bdr: '#86efac' }, building: { bg: '#fef9c3', txt: '#a16207', bdr: '#fde047' }, proposed: { bg: '#f3f4f6', txt: '#6b7280', bdr: '#d1d5db' } };
  const sp = statusPal[node.status] || null;

  document.getElementById('inspector-content').innerHTML = `
    <div class="insp-field">
      <div class="insp-lbl">Type</div>
      <div class="insp-val">
        <span class="insp-badge" style="color:${tp.txt};background:${tp.bg};border:1px solid ${tp.bdr}">${esc(node.label||'?')}</span>
      </div>
    </div>
    ${isDesign && node.section ? `<div class="insp-field"><div class="insp-lbl">Section</div><div class="insp-val" style="color:var(--c-sys);font-weight:600">${esc(node.section)}</div></div>` : ''}
    <div class="insp-field">
      <div class="insp-lbl">Name</div>
      <div class="insp-val" style="font-weight:600">${esc(node.name)||'—'}</div>
    </div>
    ${sp ? `<div class="insp-field"><div class="insp-lbl">Status</div><div class="insp-val"><span class="insp-badge" style="color:${sp.txt};background:${sp.bg};border:1px solid ${sp.bdr}">${esc(node.status)}</span></div></div>` : ''}
    <div class="insp-field">
      <div class="insp-lbl">Description</div>
      <div class="insp-val" style="font-size:11.5px;line-height:1.6;color:var(--text-muted)">${esc(node.description)||'—'}</div>
    </div>
    ${isDesign && node.rationale ? `<div class="insp-field"><div class="insp-lbl">Rationale</div><div class="insp-val" style="font-style:italic;font-size:11px;color:var(--text-muted);line-height:1.6">${esc(node.rationale)}</div></div>` : ''}
    ${node.file_path ? `<div class="insp-field"><div class="insp-lbl">Path</div><div class="insp-val" style="font-family:var(--mono);font-size:10.5px;color:var(--c-file)">${esc(node.file_path)}</div></div>` : ''}
    <div class="insp-field">
      <div class="insp-lbl">ID</div>
      <div class="insp-val" style="font-family:var(--mono);font-size:10px;color:var(--text-dim)">${esc(node.id)}</div>
    </div>
    <div class="insp-field">
      <div class="insp-lbl">Connections (${connectedEdges.length})</div>
      <ul class="insp-conns">
        ${connectedEdges.map(e => `<li>${e.src===nodeId?'→':'←'} <span style="color:var(--text-dim)">[${esc(e.rel)}]</span> ${esc(e.src===nodeId?e.dst:e.src)}</li>`).join('')||'<li style="color:var(--text-dim)">No connections</li>'}
      </ul>
    </div>
  `;
}

function setDiff(d)  { _diffData = d; }
function setGraph(n, e) { _nodes = n; _edges = e; updateStatusCounts(); }

function clearSearch() {
  const input = document.getElementById('search-input');
  if (input) input.value = '';
  const results = document.getElementById('search-results');
  if (results) results.innerHTML = '';
  if (window.CortexGraph) window.CortexGraph.clearSearch();
}

function updateStatusCounts() {
  document.getElementById('status-node-count').textContent = `${_nodes.length} nodes`;
  document.getElementById('status-edge-count').textContent = `${_edges.length} edges`;
}

function onSearchInput(q) {
  if (window.CortexGraph) { if (q) window.CortexGraph.highlightSearch(q); else window.CortexGraph.clearSearch(); }
  const ul = document.getElementById('search-results'); ul.innerHTML = '';
  if (!q) return;
  _nodes.filter(n => (n.name||'').toLowerCase().includes(q.toLowerCase()) || (n.id||'').toLowerCase().includes(q.toLowerCase())).slice(0, 20).forEach(n => {
    const li = document.createElement('li'); li.textContent = n.name||n.id; li.title = n.id;
    li.addEventListener('click', () => { if (window.CortexGraph) window.CortexGraph.focusNode(n.id); onNodeClick(n.id); });
    ul.appendChild(li);
  });
}

function openCommitModal()  { document.getElementById('commit-modal-bg').classList.add('visible'); document.getElementById('commit-msg-input').focus(); }
function closeCommitModal(e){ if (!e || e.target === document.getElementById('commit-modal-bg')) document.getElementById('commit-modal-bg').classList.remove('visible'); }
async function doCommit() {
  const msg = document.getElementById('commit-msg-input').value.trim() || 'Manual snapshot from UI';
  document.getElementById('commit-modal-bg').classList.remove('visible');
  document.getElementById('commit-msg-input').value = '';
  const r = await fetch('/api/commit', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:msg}) });
  const entry = await r.json(); _timeline.unshift(entry); renderTimeline();
}
document.getElementById('commit-msg-input').addEventListener('keydown', e => { if (e.key==='Enter') doCommit(); if (e.key==='Escape') closeCommitModal(); });

function toggleExportMenu() { const m = document.getElementById('export-menu'); m.style.display = m.style.display==='block'?'none':'block'; }
document.addEventListener('click', e => {
  if (!e.target.closest('#export-btn') && !e.target.closest('#export-menu')) {
    const m = document.getElementById('export-menu'); if (m) m.style.display = 'none';
  }
});
function exportGraph(format) {
  document.getElementById('export-menu').style.display = 'none';
  if (format==='png') { if (!window.CortexGraph) return; const d = window.CortexGraph.screenshot(); if (!d) return; const a = document.createElement('a'); a.download='cortex-graph.png'; a.href=d; a.click(); }
  else if (format==='json') { _download(new Blob([JSON.stringify({nodes:_nodes,edges:_edges},null,2)],{type:'application/json'}),'cortex-graph.json'); }
  else if (format==='triples') { const nm=Object.fromEntries(_nodes.map(n=>[n.id,n.name||n.id])); _download(new Blob([_edges.map(e=>`(${nm[e.src]||e.src})-[${e.rel}]->(${nm[e.dst]||e.dst})`).join('\n')],{type:'text/plain'}),'cortex-triples.txt'); }
}
function _download(blob, filename) { const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url); }
</script>
