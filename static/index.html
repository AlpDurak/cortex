<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cortex</title>
  <link rel="icon" id="dynamic-favicon" href="/favicon.ico" />
  <script src="https://unpkg.com/cytoscape@3.29.2/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/cytoscape-cose-bilkent@4.1.0/cytoscape-cose-bilkent.js"></script>
  <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
  <style>
    /* ── Reset ────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens ────────────────────────────────────────────────── */
    :root {
      --bg:          #09090b;
      --bg-2:        #0d0d12;
      --surface:     #111116;
      --surface-2:   #18181f;
      --surface-3:   #1f1f28;
      --border:      #27272a;
      --border-sub:  #1c1c20;
      --text:        #e4e4e7;
      --text-muted:  #71717a;
      --text-dim:    #3f3f46;
      --accent:      #6366f1;
      --accent-h:    #818cf8;
      --accent-dim:  rgba(99,102,241,0.12);
      --c-svc:       #818cf8;
      --c-db:        #34d399;
      --c-infra:     #fbbf24;
      --c-file:      #38bdf8;
      --c-sys:       #c084fc;
      --diff-add:    #22c55e;
      --diff-del:    #ef4444;
      --diff-mod:    #fbbf24;
      --rail-w:      44px;
      --sidebar-w:   224px;
      --header-h:    36px;
      --statusbar-h: 22px;
      --mono: 'Geist Mono','Cascadia Code','JetBrains Mono','Fira Code',monospace;
    }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px; line-height: 1.5;
    }

    /* ── Header ────────────────────────────────────────────────────────── */
    #header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border-sub);
      display: flex; align-items: center; gap: 10px;
      padding: 0 12px; z-index: 100; user-select: none;
    }
    #header-logo { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    #header-logo img { width: 22px; height: 22px; object-fit: contain; border-radius: 4px; }
    .logo-fallback {
      width: 22px; height: 22px; border-radius: 5px;
      background: var(--accent); color: #fff;
      font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    #header-title { font-size: 12.5px; font-weight: 600; color: var(--text); }
    #header-sep   { color: var(--text-dim); font-size: 14px; margin: 0 1px; }
    #header-project { font-size: 12px; color: var(--text-muted); }
    #header-spacer  { flex: 1; }

    .header-btn {
      height: 26px; padding: 0 10px;
      background: transparent; color: var(--text-muted);
      border: 1px solid var(--border-sub); border-radius: 5px;
      font-size: 11.5px; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: color .12s, border-color .12s, background .12s;
    }
    .header-btn:hover { color: var(--text); border-color: var(--border); background: var(--surface-2); }
    .header-btn svg { width: 12px; height: 12px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    #header-commit-btn {
      height: 26px; padding: 0 12px;
      background: var(--accent); color: #fff;
      border: none; border-radius: 5px;
      font-size: 11.5px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: background .12s;
    }
    #header-commit-btn:hover { background: var(--accent-h); }
    #header-commit-btn svg { width: 12px; height: 12px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ── Shell ──────────────────────────────────────────────────────────── */
    #shell {
      position: fixed;
      top: var(--header-h); bottom: var(--statusbar-h);
      left: 0; right: 0;
      display: flex;
    }

    /* ── Activity rail ──────────────────────────────────────────────────── */
    #icon-dock {
      width: var(--rail-w);
      background: var(--surface);
      border-right: 1px solid var(--border-sub);
      display: flex; flex-direction: column; align-items: center;
      padding-top: 6px; gap: 2px; flex-shrink: 0;
    }
    .dock-btn {
      width: 32px; height: 32px; border-radius: 7px; border: none;
      background: transparent; color: var(--text-dim);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .1s, color .1s; position: relative;
    }
    .dock-btn:hover { background: var(--surface-2); color: var(--text-muted); }
    .dock-btn.active { color: var(--text); }
    .dock-btn.active::before {
      content: ''; position: absolute; left: -1px; top: 7px; bottom: 7px;
      width: 2px; border-radius: 1px; background: var(--accent);
    }
    .dock-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

    /* ── Sidebar ────────────────────────────────────────────────────────── */
    #secondary-sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border-sub);
      display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden;
    }
    .panel-header {
      padding: 9px 12px 6px;
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .1em;
      color: var(--text-dim); flex-shrink: 0;
    }

    /* Timeline */
    #timeline-panel { flex: 0 0 auto; border-bottom: 1px solid var(--border-sub); display: flex; flex-direction: column; }
    #timeline-list  { list-style: none; padding: 0 0 4px; }
    #timeline-list li {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 5px 12px; cursor: pointer;
      transition: background .1s; border-left: 2px solid transparent;
    }
    #timeline-list li:hover    { background: var(--surface-2); }
    #timeline-list li.selected { background: var(--surface-3); border-left-color: var(--accent); }
    .tl-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid var(--text-dim); margin-top: 3px; }
    li.selected .tl-dot { border-color: var(--accent); background: var(--accent); }
    li:first-child .tl-dot { border-color: var(--diff-add); background: var(--diff-add); }
    .tl-label { font-size: 11.5px; color: var(--text); line-height: 1.3; }
    .tl-ts    { font-size: 10px; color: var(--text-dim); font-family: var(--mono); margin-top: 1px; }
    #diff-banner {
      display: none; margin: 4px 8px 6px; padding: 4px 8px; border-radius: 4px;
      background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.25);
      font-size: 10px; color: var(--diff-mod); font-family: var(--mono);
    }
    #diff-banner.visible { display: block; }

    /* Inspector */
    #inspector-panel   { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    #inspector-content { padding: 6px 12px 14px; flex: 1; }
    #inspector-content .empty-msg { color: var(--text-dim); font-size: 11px; margin-top: 2px; font-style: italic; }
    .inspector-field   { margin-bottom: 9px; }
    .inspector-label   { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); margin-bottom: 2px; }
    .inspector-value   { font-size: 11.5px; color: var(--text); word-break: break-all; line-height: 1.4; }
    .inspector-badge   { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 99px; font-size: 10.5px; font-weight: 600; }
    .inspector-connections { list-style: none; }
    .inspector-connections li { font-size: 10.5px; color: var(--text-muted); padding: 3px 0; border-bottom: 1px solid var(--border-sub); font-family: var(--mono); line-height: 1.3; }
    .inspector-connections li:last-child { border-bottom: none; }

    /* Search */
    #search-panel { display: none; flex-direction: column; flex-shrink: 0; border-bottom: 1px solid var(--border-sub); }
    .search-input-wrap { padding: 0 10px 8px; }
    #search-input {
      width: 100%; padding: 5px 9px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 5px; color: var(--text); font-size: 11.5px; outline: none;
      transition: border-color .12s;
    }
    #search-input:focus { border-color: var(--accent); }
    #search-input::placeholder { color: var(--text-dim); }
    #search-results { list-style: none; margin-top: 4px; max-height: 180px; overflow-y: auto; }
    #search-results li { padding: 4px 4px; border-radius: 4px; cursor: pointer; font-size: 11px; font-family: var(--mono); color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #search-results li:hover { background: var(--surface-3); color: var(--text); }

    /* Filter */
    #filter-panel  { display: none; flex-direction: column; flex-shrink: 0; border-bottom: 1px solid var(--border-sub); }
    #filter-toggles { padding: 4px 10px 8px; display: flex; flex-wrap: wrap; gap: 4px; }
    .filter-pill { padding: 2px 9px; border-radius: 99px; font-size: 10.5px; cursor: pointer; font-family: var(--mono); border: 1px solid var(--border); color: var(--text-muted); background: transparent; transition: all .12s; }
    .filter-pill.active { background: var(--accent-dim); color: var(--accent-h); border-color: rgba(99,102,241,0.3); }

    /* Vitals */
    #vitals-panel { display: none; flex-direction: column; flex: 1; overflow-y: auto; }
    #vitals-content { padding: 6px 12px 14px; }

    /* ── Canvas ──────────────────────────────────────────────────────────── */
    #main          { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
    #canvas-wrapper { flex: 1; position: relative; overflow: hidden; }
    #graph-canvas  { width: 100%; height: 100%; background: var(--bg); }

    /* ── Status bar ──────────────────────────────────────────────────────── */
    #status-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--statusbar-h);
      background: var(--surface);
      border-top: 1px solid var(--border-sub);
      display: flex; align-items: center;
      padding: 0 12px; gap: 14px;
      font-size: 10.5px; color: var(--text-dim);
      font-family: var(--mono); z-index: 50;
    }
    #status-ws  { display: flex; align-items: center; gap: 5px; }
    #ws-dot     { width: 5px; height: 5px; border-radius: 50%; background: var(--text-dim); }
    #ws-dot.connected { background: var(--diff-add); box-shadow: 0 0 4px var(--diff-add); }
    #ws-dot.error     { background: var(--diff-del); }
    #ws-label   { color: var(--text-muted); }
    .status-sep { color: var(--border); }
    #status-slot { color: var(--accent); }

    /* ── Export menu ─────────────────────────────────────────────────────── */
    #export-menu {
      display: none; position: absolute; right: 0; top: 32px;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px;
      min-width: 148px; z-index: 200; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
    }
    .export-item { padding: 8px 12px; font-size: 11.5px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; gap: 7px; transition: background .1s, color .1s; }
    .export-item:hover { background: var(--surface-3); color: var(--text); }
    .export-item svg { width: 12px; height: 12px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* ── Commit modal ────────────────────────────────────────────────────── */
    #commit-modal-bg {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.65); backdrop-filter: blur(4px);
      z-index: 200; align-items: center; justify-content: center;
    }
    #commit-modal-bg.visible { display: flex; }
    #commit-modal {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 22px 22px 18px; width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 4px 16px rgba(0,0,0,.4);
    }
    #commit-modal h3 { font-size: 13.5px; color: var(--text); margin-bottom: 12px; font-weight: 600; }
    #commit-msg-input {
      width: 100%; padding: 8px 10px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-size: 12.5px; outline: none; transition: border-color .12s;
    }
    #commit-msg-input:focus { border-color: var(--accent); }
    #commit-msg-input::placeholder { color: var(--text-dim); }
    .modal-actions { display: flex; gap: 6px; margin-top: 12px; justify-content: flex-end; }
    .btn-primary  { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 6px 16px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background .12s; }
    .btn-primary:hover  { background: var(--accent-h); }
    .btn-secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; font-size: 12px; cursor: pointer; transition: background .12s, color .12s; }
    .btn-secondary:hover { background: var(--surface-3); color: var(--text); }

    /* ── Scrollbars ──────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border); }
  </style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div id="header-logo">
    <div class="logo-fallback" id="logo-fallback">C</div>
    <img id="logo-img" src="" alt="logo" style="display:none" />
  </div>
  <span id="header-title">Cortex</span>
  <span id="header-sep">/</span>
  <span id="header-project"></span>
  <div id="header-spacer"></div>

  <div style="position:relative">
    <button class="header-btn" id="export-btn" onclick="toggleExportMenu()">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export
    </button>
    <div id="export-menu">
      <div class="export-item" onclick="exportGraph('png')">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        PNG Screenshot
      </div>
      <div class="export-item" onclick="exportGraph('json')">
        <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        JSON Graph
      </div>
      <div class="export-item" onclick="exportGraph('triples')">
        <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        Semantic Triples
      </div>
    </div>
  </div>

  <button id="header-commit-btn" onclick="openCommitModal()">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><line x1="1.05" y1="12" x2="7" y2="12"/><line x1="17.01" y1="12" x2="22.96" y2="12"/></svg>
    Commit
  </button>
</div>

<!-- SHELL -->
<div id="shell">

  <!-- ACTIVITY RAIL -->
  <div id="icon-dock">
    <button class="dock-btn active" id="btn-timeline" title="Timeline" onclick="setActivePanel('timeline')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 6 12 12 16.5 12"/></svg>
    </button>
    <button class="dock-btn" id="btn-search" title="Search" onclick="setActivePanel('search')">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.65" y1="16.65" x2="21" y2="21"/></svg>
    </button>
    <button class="dock-btn" id="btn-filter" title="Edge Filters" onclick="setActivePanel('filter')">
      <svg viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
    </button>
    <button class="dock-btn" id="btn-vitals" title="Vitals" onclick="setActivePanel('vitals')">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    </button>
  </div>

  <!-- SIDEBAR -->
  <div id="secondary-sidebar">

    <div id="search-panel">
      <div class="panel-header">Search</div>
      <div class="search-input-wrap">
        <input id="search-input" type="text" placeholder="Name or ID…" oninput="onSearchInput(this.value)" />
        <ul id="search-results"></ul>
      </div>
    </div>

    <div id="filter-panel">
      <div class="panel-header">Edge Types</div>
      <div id="filter-toggles"></div>
    </div>

    <div id="vitals-panel">
      <div class="panel-header">Vitals</div>
      <div id="vitals-content"></div>
    </div>

    <div id="timeline-panel">
      <div class="panel-header">Timeline</div>
      <ul id="timeline-list"></ul>
      <div id="diff-banner"></div>
    </div>

    <div id="inspector-panel">
      <div class="panel-header">Inspector</div>
      <div id="inspector-content">
        <p class="empty-msg">Click a node to inspect it.</p>
      </div>
    </div>

  </div>

  <!-- CANVAS -->
  <div id="main">
    <div id="canvas-wrapper">
      <div id="graph-canvas"></div>
    </div>
  </div>

</div>

<!-- STATUS BAR -->
<div id="status-bar">
  <div id="status-ws">
    <div id="ws-dot"></div>
    <span id="ws-label">Connecting…</span>
  </div>
  <span class="status-sep">·</span>
  <span id="status-node-count">0 nodes</span>
  <span class="status-sep">·</span>
  <span id="status-edge-count">0 edges</span>
  <span class="status-sep">·</span>
  <span id="status-slot">live</span>
</div>

<!-- COMMIT MODAL -->
<div id="commit-modal-bg" onclick="closeCommitModal(event)">
  <div id="commit-modal">
    <h3>Commit Graph Snapshot</h3>
    <input id="commit-msg-input" type="text" placeholder="Describe this snapshot…" maxlength="200" />
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeCommitModal()">Cancel</button>
      <button class="btn-primary"   onclick="doCommit()">Commit</button>
    </div>
  </div>
</div>

<script>
let _ws = null, _nodes = [], _edges = [], _timeline = [];
let _selectedSlot = 0, _selectedNodeId = null, _diffData = null;

window.CortexUI = { onNodeClick, setDiff, setGraph };

(async function init() {
  await loadMeta();
  await loadTimeline();
  connectWS();
})();

async function loadMeta() {
  try {
    const r = await fetch('/api/meta');
    const meta = await r.json();
    document.title = 'Cortex — ' + meta.project_name;
    document.getElementById('header-project').textContent = meta.project_name;
    if (meta.favicon_b64) {
      const dataUrl = `data:${meta.favicon_mime};base64,${meta.favicon_b64}`;
      document.getElementById('dynamic-favicon').href = dataUrl;
      const li = document.getElementById('logo-img'), lf = document.getElementById('logo-fallback');
      li.src = dataUrl; li.style.display = 'block'; lf.style.display = 'none';
    } else {
      document.getElementById('logo-fallback').textContent = (meta.project_name || 'C')[0].toUpperCase();
    }
  } catch(e) { console.warn('Meta load failed:', e); }
}

async function loadTimeline() {
  try {
    const r = await fetch('/api/timeline');
    _timeline = await r.json();
    renderTimeline();
  } catch(e) { console.warn('Timeline load failed:', e); }
}

function renderTimeline() {
  const ul = document.getElementById('timeline-list');
  ul.innerHTML = '';
  const all = [{ slot: 0, label: 'Live', timestamp: '', message: '' }, ..._timeline];
  all.forEach((v, i) => {
    const li = document.createElement('li');
    if (v.slot === _selectedSlot) li.classList.add('selected');
    const dot = document.createElement('div'); dot.className = 'tl-dot';
    const info = document.createElement('div'); info.style.minWidth = '0';
    const label = document.createElement('div'); label.className = 'tl-label';
    label.textContent = v.label || (i === 0 ? 'Live' : `Commit #${_timeline.length - i + 1}`);
    info.appendChild(label);
    if (v.message) { const m = document.createElement('div'); m.className = 'tl-ts'; m.textContent = v.message; info.appendChild(m); }
    if (v.timestamp) { const t = document.createElement('div'); t.className = 'tl-ts'; t.textContent = v.timestamp.replace('T',' ').slice(0,16); info.appendChild(t); }
    li.appendChild(dot); li.appendChild(info);
    li.addEventListener('click', () => selectSlot(v.slot));
    ul.appendChild(li);
  });
}

async function selectSlot(slot) {
  _selectedSlot = slot; _diffData = null;
  document.querySelectorAll('#timeline-list li').forEach((li, i) => {
    const allSlots = [0, ..._timeline.map(v => v.slot)];
    li.classList.toggle('selected', allSlots[i] === slot);
  });
  const banner = document.getElementById('diff-banner');
  if (slot === 0) {
    banner.classList.remove('visible');
    await loadGraph(0);
  } else {
    await loadGraph(0);
    const currentSlot = _timeline.length > 0 ? _timeline[0].slot : null;
    if (currentSlot && currentSlot !== slot) {
      const diffR = await fetch(`/api/diff?from_slot=${slot}&to_slot=${currentSlot}`);
      _diffData = await diffR.json();
      const oldR = await fetch(`/api/graph?slot=${slot}`);
      const oldData = await oldR.json();
      const liveIds = new Set(_nodes.map(n => n.id));
      for (const on of (oldData.nodes || [])) { if (!liveIds.has(on.id)) _nodes.push(on); }
      for (const oe of (oldData.edges || [])) {
        const key = e => e.src+'|'+e.rel+'|'+e.dst;
        const liveKeys = new Set(_edges.map(key));
        if (!liveKeys.has(key(oe))) _edges.push(oe);
      }
      banner.textContent = `Diff ${slot} → current  ·  +${_diffData.added_nodes.length}  -${_diffData.deleted_nodes.length}  ~${_diffData.modified_nodes.length}`;
      banner.classList.add('visible');
    }
  }
  updateStatusCounts();
  if (window.CortexGraph) window.CortexGraph.render(_nodes, _edges, _diffData);
  else window._pendingGraph = { nodes: _nodes, edges: _edges, diffData: _diffData };
  document.getElementById('status-slot').textContent = slot === 0 ? 'live' : `slot ${slot}`;
}

async function loadGraph(slot) {
  const url = slot === 0 ? '/api/graph' : `/api/graph?slot=${slot}`;
  try {
    const r = await fetch(url); const data = await r.json();
    _nodes = data.nodes || []; window._nodes = _nodes;
    _edges = data.edges || []; window._edges = _edges;
    updateStatusCounts();
  } catch(e) { console.warn('Graph load failed:', e); }
}

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  _ws = new WebSocket(`${proto}://${location.host}/ws`);
  const dot = document.getElementById('ws-dot'), label = document.getElementById('ws-label');
  _ws.onopen  = () => { dot.className = 'connected'; label.textContent = 'Connected'; };
  _ws.onclose = () => { dot.className = 'error'; label.textContent = 'Disconnected'; setTimeout(connectWS, 3000); };
  _ws.onerror = () => { dot.className = 'error'; };
  _ws.onmessage = evt => handleWSMessage(JSON.parse(evt.data));
}

function handleWSMessage(msg) {
  if (msg.event === 'init') {
    _nodes = msg.nodes || []; window._nodes = _nodes;
    _edges = msg.edges || []; _timeline = msg.timeline || [];
    renderTimeline(); updateStatusCounts();
    if (window.CortexGraph) window.CortexGraph.render(_nodes, _edges, null);
    else window._pendingGraph = { nodes: _nodes, edges: _edges, diffData: null };
  } else if (msg.event === 'node_added') {
    _nodes.push(msg.node); (msg.edges||[]).forEach(e => _edges.push(e)); updateStatusCounts();
    if (window.CortexGraph && _selectedSlot === 0) window.CortexGraph.addNode(msg.node, msg.edges||[]);
  } else if (msg.event === 'snapshot') {
    _timeline.unshift(msg.entry); renderTimeline();
  }
}

function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function onNodeClick(nodeId) {
  _selectedNodeId = nodeId;
  const node = _nodes.find(n => n.id === nodeId);
  if (!node) return;
  const connectedEdges = _edges.filter(e => e.src === nodeId || e.dst === nodeId);
  const isDesign = node.label === 'SystemDesign';
  const statusColor = { 'shipped': '#059669', 'building': '#d97706', 'proposed': '#52525b' };
  const sc = statusColor[node.status] || '#52525b';
  const nodeTypeColor = { Service:'var(--c-svc)', Database:'var(--c-db)', Infrastructure:'var(--c-infra)', File:'var(--c-file)', SystemDesign:'var(--c-sys)' };
  const tc = nodeTypeColor[node.label] || 'var(--accent-h)';
  document.getElementById('inspector-content').innerHTML = `
    <div class="inspector-field">
      <div class="inspector-label">Type</div>
      <div class="inspector-value"><span class="inspector-badge" style="color:${tc};background:rgba(255,255,255,0.04);border:1px solid ${tc}44">${esc(node.label||'?')}</span></div>
    </div>
    ${isDesign && node.section ? `<div class="inspector-field"><div class="inspector-label">Section</div><div class="inspector-value" style="color:var(--c-sys);font-weight:600">${esc(node.section)}</div></div>` : ''}
    <div class="inspector-field">
      <div class="inspector-label">Name</div>
      <div class="inspector-value" style="font-weight:600">${esc(node.name)||'—'}</div>
    </div>
    ${node.status ? `<div class="inspector-field"><div class="inspector-label">Status</div><div class="inspector-value"><span style="display:inline-block;padding:1px 8px;border-radius:99px;font-size:10.5px;font-weight:600;background:${esc(sc)}22;color:${esc(sc)};border:1px solid ${esc(sc)}44">${esc(node.status)}</span></div></div>` : ''}
    <div class="inspector-field">
      <div class="inspector-label">Description</div>
      <div class="inspector-value" style="font-size:11px;line-height:1.5;color:var(--text-muted)">${esc(node.description)||'—'}</div>
    </div>
    ${isDesign && node.rationale ? `<div class="inspector-field"><div class="inspector-label">Rationale</div><div class="inspector-value" style="font-style:italic;font-size:10.5px;color:var(--text-muted);line-height:1.5">${esc(node.rationale)}</div></div>` : ''}
    ${node.file_path ? `<div class="inspector-field"><div class="inspector-label">Path</div><div class="inspector-value" style="font-family:var(--mono);font-size:10px;color:var(--c-file)">${esc(node.file_path)}</div></div>` : ''}
    <div class="inspector-field">
      <div class="inspector-label">ID</div>
      <div class="inspector-value" style="font-family:var(--mono);font-size:9.5px;color:var(--text-dim)">${esc(node.id)}</div>
    </div>
    <div class="inspector-field">
      <div class="inspector-label">Connections (${connectedEdges.length})</div>
      <ul class="inspector-connections">
        ${connectedEdges.map(e => `<li>${e.src===nodeId?'→':'←'} <span style="color:var(--text-dim)">[${esc(e.rel)}]</span> ${esc(e.src===nodeId?e.dst:e.src)}</li>`).join('')||'<li style="color:var(--text-dim)">No connections</li>'}
      </ul>
    </div>
  `;
}

let _activePanel = 'timeline';
function setActivePanel(panel) {
  _activePanel = panel;
  document.querySelectorAll('.dock-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-'+panel)?.classList.add('active');
  if (panel !== 'search') { const i = document.getElementById('search-input'); if (i && i.value) { i.value=''; onSearchInput(''); } }
  const panels = { timeline:'timeline-panel', search:'search-panel', filter:'filter-panel', vitals:'vitals-panel' };
  Object.values(panels).forEach(id => { const el = document.getElementById(id); if(el) el.style.display='none'; });
  const active = document.getElementById(panels[panel]);
  if (active) active.style.display = 'flex';
  if (panel === 'filter') buildFilterToggles();
}

function setDiff(d) { _diffData = d; }
function setGraph(n, e) { _nodes = n; _edges = e; updateStatusCounts(); }

function updateStatusCounts() {
  document.getElementById('status-node-count').textContent = `${_nodes.length} nodes`;
  document.getElementById('status-edge-count').textContent = `${_edges.length} edges`;
}

function onSearchInput(q) {
  if (window.CortexGraph) { if (q) window.CortexGraph.highlightSearch(q); else window.CortexGraph.clearSearch(); }
  const ul = document.getElementById('search-results'); ul.innerHTML = '';
  if (!q) return;
  _nodes.filter(n => (n.name||'').toLowerCase().includes(q.toLowerCase()) || (n.id||'').toLowerCase().includes(q.toLowerCase())).slice(0,20).forEach(n => {
    const li = document.createElement('li'); li.textContent = n.name||n.id; li.title = n.id;
    li.addEventListener('click', () => { if (window.CortexGraph) window.CortexGraph.focusNode(n.id); onNodeClick(n.id); });
    ul.appendChild(li);
  });
}

let _hiddenEdgeLabels = new Set();
function buildFilterToggles() {
  const c = document.getElementById('filter-toggles'); if (!c) return;
  const labels = [...new Set(_edges.map(e => e.rel).filter(Boolean))].sort();
  const ls = new Set(labels);
  for (const h of _hiddenEdgeLabels) { if (!ls.has(h)) _hiddenEdgeLabels.delete(h); }
  c.innerHTML = '';
  labels.forEach(label => {
    const pill = document.createElement('button');
    pill.className = 'filter-pill' + (_hiddenEdgeLabels.has(label) ? '' : ' active');
    pill.textContent = label;
    pill.addEventListener('click', () => {
      if (_hiddenEdgeLabels.has(label)) { _hiddenEdgeLabels.delete(label); pill.classList.add('active'); }
      else { _hiddenEdgeLabels.add(label); pill.classList.remove('active'); }
      if (window.CortexGraph) window.CortexGraph.filterEdgesByLabel(_hiddenEdgeLabels);
    });
    c.appendChild(pill);
  });
}

function openCommitModal()  { document.getElementById('commit-modal-bg').classList.add('visible'); document.getElementById('commit-msg-input').focus(); }
function closeCommitModal(e){ if (!e || e.target === document.getElementById('commit-modal-bg')) document.getElementById('commit-modal-bg').classList.remove('visible'); }
async function doCommit() {
  const msg = document.getElementById('commit-msg-input').value.trim() || 'Manual snapshot from UI';
  document.getElementById('commit-modal-bg').classList.remove('visible');
  document.getElementById('commit-msg-input').value = '';
  const r = await fetch('/api/commit', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:msg}) });
  const entry = await r.json(); _timeline.unshift(entry); renderTimeline();
}
document.getElementById('commit-msg-input').addEventListener('keydown', e => { if (e.key==='Enter') doCommit(); if (e.key==='Escape') closeCommitModal(); });

function toggleExportMenu() { const m = document.getElementById('export-menu'); m.style.display = m.style.display==='block'?'none':'block'; }
document.addEventListener('click', e => {
  if (!e.target.closest('#export-btn') && !e.target.closest('#export-menu')) {
    const m = document.getElementById('export-menu'); if (m) m.style.display = 'none';
  }
});
function exportGraph(format) {
  document.getElementById('export-menu').style.display = 'none';
  if (format==='png') { if (!window.CortexGraph) return; const d = window.CortexGraph.screenshot(); if (!d) return; const a = document.createElement('a'); a.download='cortex-graph.png'; a.href=d; a.click(); }
  else if (format==='json') { _download(new Blob([JSON.stringify({nodes:_nodes,edges:_edges},null,2)],{type:'application/json'}),'cortex-graph.json'); }
  else if (format==='triples') { const nm=Object.fromEntries(_nodes.map(n=>[n.id,n.name||n.id])); _download(new Blob([_edges.map(e=>`(${nm[e.src]||e.src})-[${e.rel}]->(${nm[e.dst]||e.dst})`).join('\n')],{type:'text/plain'}),'cortex-triples.txt'); }
}
function _download(blob, filename) { const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url); }
</script>
