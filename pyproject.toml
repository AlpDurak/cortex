[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cortex"
version = "0.1.0"
description = "Local MCP server and knowledge graph visualizer for software projects"
requires-python = ">=3.11"
dependencies = [
    "kuzu>=0.6.0",
    "mcp>=1.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "watchdog>=4.0.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
analysis = [
    "leidenalg>=0.10.0",
    "python-igraph>=0.11.0",
]
svg = [
    "cairosvg>=2.7.0",
]
neo4j = [
    "neo4j>=5.0.0",
]
falkordb = [
    "falkordb>=1.0.0",
]

[project.scripts]
cortex = "cortex.main:main"

[tool.setuptools.packages.find]
where = ["."]
